
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10152b">
<title>آرش AI</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--line:#293554;--text:#f4f6ff;--muted:#aab4d0;--accent:#8b7cff;--accent2:#35c9c1}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0%,#24265a 0,transparent 38%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:22px 16px 40px}
.top{display:flex;align-items:center;gap:13px;padding:12px 0 24px}
.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:25px}
h1{font-size:22px;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.hero{text-align:center;padding:35px 12px 26px}
.orb{width:78px;height:78px;margin:0 auto 18px;border-radius:26px;background:linear-gradient(140deg,#7668ff,#31c8be);display:grid;place-items:center;font-size:39px}
.hero h2{font-size:26px;margin:0 0 10px}
.hero p{color:var(--muted);line-height:1.9;font-size:14px}
.panel{background:#121a30;border:1px solid var(--line);border-radius:22px;padding:16px}
.messages{min-height:170px;max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:5px 2px 15px}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.9;font-size:14px;white-space:pre-wrap}
.bot{align-self:flex-start;background:#202b49;border:1px solid #344365}
.user{align-self:flex-end;background:linear-gradient(135deg,#655ce0,#4d6bd0)}
.composer{display:flex;gap:9px;border-top:1px solid var(--line);padding-top:14px}
input{flex:1;min-width:0;background:#0c1326;border:1px solid #344365;border-radius:14px;padding:14px;color:white;font:14px Tahoma;outline:none}
button{border:0;border-radius:14px;padding:0 19px;background:linear-gradient(135deg,var(--accent),#5d76dc);color:white;font:bold 14px Tahoma;cursor:pointer}
button:disabled{opacity:.5}
.note{color:#8995b5;font-size:11px;line-height:1.8;margin:12px 4px 0}
footer{text-align:center;color:#7885a7;font-size:11px;padding:24px 0}
</style>
</head>
<body>
<main class="wrap">
<header class="top">
<div class="logo">✦</div>
<div>
<h1>آرش AI</h1>
<div class="sub">دستیار هوشمند فارسی</div>
</div>
</header>

<section class="hero">
<div class="orb">🤖</div>
<h2>سلام! به آرش AI خوش آمدی</h2>
<p>من آرش AI هستم؛ سؤال خودت را بنویس تا پاسخ بدهم.</p>
</section>

<section class="panel">
<div class="messages" id="messages" aria-live="polite">
<div class="msg bot">سلام! من آرش AI هستم. چطور می‌توانم کمکت کنم؟</div>
</div>

<form class="composer" id="form">
<input id="prompt" autocomplete="off" placeholder="پیامت را اینجا بنویس..." aria-label="پیام شما">
<button type="submit">ارسال</button>
</form>
<p class="note">برای پاسخ‌گویی به اینترنت متصل باش.</p>
</section>

<footer>آرش AI · دستیار هوشمند تو</footer>
</main>

<script>
const form=document.getElementById('form');
const input=document.getElementById('prompt');
const messages=document.getElementById('messages');
const API_URL='https://arash-ai-api.arashidearashid.workers.dev/';

function addMessage(text,cls){
const el=document.createElement('div');
el.className='msg '+cls;
el.textContent=text;
messages.appendChild(el);
messages.scrollTop=messages.scrollHeight;
return el;
}

form.addEventListener('submit',async e=>{
e.preventDefault();
const value=input.value.trim();
if(!value)return;

addMessage(value,'user');
input.value='';

const waiting=addMessage('آرش AI در حال فکر کردن است...','bot');
const button=form.querySelector('button');
button.disabled=true;

try{
const response=await fetch(API_URL,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({prompt:value})
});
const data=await response.json();

if(!response.ok)throw new Error(data.error||'خطا در ارتباط با سرور');

waiting.textContent=data.reply||'پاسخی دریافت نشد.';
}catch(error){
waiting.textContent='خطا در اتصال: '+error.message;
}finally{
button.disabled=false;
input.focus();
messages.scrollTop=messages.scrollHeight;
}
});
</script>
</body>
</html>
